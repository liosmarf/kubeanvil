argocd_chart_version: 10.10.5
argocd_namespace: argocd

# Rendered from cluster.yaml (spec.gitops).
argocd_repo_url: ""
argocd_repo_revision: main
# The platform chart renders every component. Its cluster-specific values travel inside the
# root Application (ADR 0007); a fork that keeps them in Git sets argocd_cluster_values instead.
argocd_platform_path: gitops/platform
argocd_platform_values: {}
argocd_cluster_values: ""  # e.g. gitops/clusters/lab/values.yaml

# Bootstrap secrets from secrets.sops.yaml, passed by `kubeanvil apply` in KUBEANVIL_SECRETS.
argocd_bootstrap_secrets: "{{ lookup('ansible.builtin.env', 'KUBEANVIL_SECRETS', default='') | default('{}', true) | from_json }}"

# Only for private repositories. HTTPS: username + password (a read-only token).
# SSH: ssh_private_key + ssh_known_hosts.
argocd_repo_credentials: "{{ argocd_bootstrap_secrets.gitops | default({}, true) }}"

# Components installed by K3s during bootstrap and adopted by Argo CD afterwards.
argocd_handover:
  - { app: cilium, chart: cilium, files: [cilium.yaml, cilium-lb.yaml], addons: [cilium, cilium-lb] }
  - { app: argocd, chart: argocd, files: [argocd.yaml], addons: [argocd] }
