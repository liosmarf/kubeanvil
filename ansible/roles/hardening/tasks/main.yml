# Validated with sshd -t before it is installed: a broken file would lock us out.
- name: Hardened SSH configuration
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

# apport resets fs.suid_dumpable to 2 on every boot; remove it before setting sysctls.
- name: Remove apport
  ansible.builtin.apt:
    name: apport
    state: absent
    purge: true

- name: Security kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/80-hardening.conf
  loop: "{{ hardening_sysctl | dict2items }}"

- name: No core dumps
  ansible.builtin.copy:
    dest: /etc/security/limits.d/10-no-core.conf
    content: "* hard core 0\n"
    mode: "0644"

- name: Audit rules
  ansible.builtin.copy:
    src: kubeanvil.rules
    dest: /etc/audit/rules.d/50-kubeanvil.rules
    mode: "0640"
  notify: Load audit rules

# Rules on disk are not rules in the kernel: check what is actually loaded.
- name: Audit rules loaded in the kernel
  ansible.builtin.command: auditctl -l
  register: hardening_audit_loaded
  changed_when: false
  check_mode: false

- name: Load audit rules if missing
  ansible.builtin.command: augenrules --load
  when: "'k3s-config' not in hardening_audit_loaded.stdout"
  changed_when: true

- name: Audit daemon running
  ansible.builtin.systemd_service:
    name: auditd
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Journald configuration directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Persistent, size-capped journal
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-kubeanvil.conf
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      Compress=yes
      SystemMaxUse={{ hardening_journald_max_use }}
  notify: Restart journald

- name: Login banner
  ansible.builtin.copy:
    dest: /etc/issue.net
    content: "{{ hardening_banner }}\n"
    mode: "0644"

- name: Restrictive permissions on sensitive files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
  loop: [/etc/ssh/sshd_config, /etc/crontab]
