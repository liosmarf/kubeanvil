- name: Agent configuration
  ansible.builtin.template:
    src: config-agent.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  no_log: true
  notify: Restart k3s

- name: Agent running
  ansible.builtin.systemd_service:
    name: k3s-agent
    state: started
    enabled: true
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
