k3s_version: v1.36.5+k3s1
k3s_kube_vip_version: v1.3.0

# Rendered from cluster.yaml by `kubeanvil generate`.
k3s_api_vip: ""
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16

# Detected per node; override only if the default route uses another NIC.
k3s_interface: "{{ ansible_facts.default_ipv4.interface }}"

k3s_bootstrap_server: "{{ groups['control_plane'][0] }}"
# Control planes run only critical add-ons when there are workers to run the rest.
k3s_taint_control_plane: "{{ groups['workers'] | length > 0 }}"

k3s_etcd_snapshot_cron: "0 */6 * * *"
k3s_etcd_snapshot_retention: 12
# Off unless set: { endpoint, bucket, region, folder, access_key, secret_key }
k3s_etcd_s3: {}

k3s_audit_log_maxage: 30
k3s_audit_log_maxbackup: 10
k3s_audit_log_maxsize: 100

# Optional pull-through caches, e.g. { docker.io: http://10.0.0.50:5000 }
k3s_registry_mirrors: {}
