base_admin_user: ops
# Exclusive list: keys added by hand are removed on the next run.
base_admin_ssh_keys: []
base_timezone: UTC
base_ntp_servers: [time.cloudflare.com, ntp.ubuntu.com]

base_packages:
  - apt-transport-https
  - auditd
  - bash-completion
  - ca-certificates
  - chrony
  - curl
  - jq
  - nftables
  - unattended-upgrades
# Longhorn needs iSCSI; nfs-common lets workloads mount NFS volumes.
base_worker_packages: [open-iscsi, nfs-common, cryptsetup, dmsetup]
base_removed_packages: [snapd, ubuntu-advantage-tools, popularity-contest]

base_kernel_modules: [overlay, br_netfilter]
base_sysctl:
  net.ipv4.ip_forward: 1
  net.ipv6.conf.all.forwarding: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  fs.inotify.max_user_instances: 8192
  fs.inotify.max_user_watches: 524288
  vm.max_map_count: 262144
  # Required by the kubelet's --protect-kernel-defaults
  vm.overcommit_memory: 1
  vm.panic_on_oom: 0
  kernel.panic: 10
  kernel.panic_on_oops: 1
