- name: Authorised SSH keys
  ansible.posix.authorized_key:
    user: "{{ base_admin_user }}"
    key: "{{ base_admin_ssh_keys | join('\n') }}"
    exclusive: true
  when: base_admin_ssh_keys | length > 0
  tags: [ssh-keys]

- name: Time zone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Packages
  ansible.builtin.apt:
    name: "{{ base_packages + (base_worker_packages if inventory_hostname in groups['workers'] else []) }}"
    update_cache: true
    cache_valid_time: 3600

- name: Remove packages a server does not need
  ansible.builtin.apt:
    name: "{{ base_removed_packages }}"
    state: absent
    purge: true

# Time: etcd and certificates need synchronised clocks.
- name: Chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    mode: "0644"
  register: base_chrony_conf_file
  notify: Restart chrony

- name: Chrony running
  ansible.builtin.systemd_service:
    name: chrony
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}" # package is only simulated in --check

# A missed handler leaves chronyd running an old config. Compare start time with mtime.
- name: Chrony config modification time
  ansible.builtin.stat:
    path: /etc/chrony/chrony.conf
  register: base_chrony_conf

- name: Chrony service state
  ansible.builtin.systemd_service:
    name: chrony
  register: base_chrony_svc

- name: Restart chrony if it runs a stale configuration
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted
  when:
    - not base_chrony_conf_file.changed
    - base_chrony_svc.status.ActiveEnterTimestamp | default('') | length > 0
    - (base_chrony_svc.status.ActiveEnterTimestamp | to_datetime('%a %Y-%m-%d %H:%M:%S %Z')).timestamp() < base_chrony_conf.stat.mtime

# Kubernetes prerequisites
- name: Kernel modules loaded
  community.general.modprobe:
    name: "{{ item }}"
  loop: "{{ base_kernel_modules }}"

- name: Kernel modules loaded at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: "{{ base_kernel_modules | join('\n') }}\n"
    mode: "0644"

- name: Kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-kubernetes.conf
  loop: "{{ base_sysctl | dict2items }}"

- name: Swap off now
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb | int > 0
  changed_when: true

- name: Swap off at boot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

# Security updates only, never an automatic reboot: Kured drains and reboots one node at a time.
- name: Unattended security upgrades without reboot
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-kubeanvil
    mode: "0644"
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

- name: Periodic apt runs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Longhorn prerequisites on workers
  when: inventory_hostname in groups['workers']
  block:
    - name: ISCSI daemon running
      ansible.builtin.systemd_service:
        name: iscsid
        state: started
        enabled: true
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Multipath configuration directory
      ansible.builtin.file:
        path: /etc/multipath/conf.d
        state: directory
        mode: "0755"

    # Otherwise multipathd can claim Longhorn's block devices.
    - name: Multipath ignores sd* devices
      ansible.builtin.copy:
        dest: /etc/multipath/conf.d/longhorn.conf
        mode: "0644"
        content: |
          blacklist {
              devnode "^sd[a-z0-9]+"
          }
      notify: Restart multipathd
