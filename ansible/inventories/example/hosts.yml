# Example of what `kubeanvil generate` renders from Terraform's `nodes` output.
all:
  vars:
    ansible_user: ops
  children:
    control_plane:
      hosts:
        lab-cp-01: { ansible_host: 192.168.50.91, zone: pve }
        lab-cp-02: { ansible_host: 192.168.50.92, zone: pve }
        lab-cp-03: { ansible_host: 192.168.50.93, zone: pve }
    workers:
      hosts:
        lab-wk-01: { ansible_host: 192.168.50.94, zone: pve }
        lab-wk-02: { ansible_host: 192.168.50.95, zone: pve }
        lab-wk-03: { ansible_host: 192.168.50.96, zone: pve }
