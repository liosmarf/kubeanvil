[defaults]
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
# Run pending handlers even if a later task fails, so services never keep a stale config.
force_handlers = True
forks = 10
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.cache/kubeanvil/ansible-facts
fact_caching_timeout = 3600
# Nodes recreated by Terraform get new host keys on the same IPs.
host_key_checking = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
