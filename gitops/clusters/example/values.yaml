  revision: main

components:
  cni: cilium
  gateway: cilium
  storage: longhorn
  gitops: argocd
  secrets: none
  policy: kyverno
  identity: none
  metrics: kube-prometheus-stack
  logs: loki
  tracing: none
  databases: cloudnative-pg
  management-ui: none
