defaultSettings:
  defaultDataPath: /var/lib/longhorn # the dedicated data disk, mounted by Ansible
  defaultReplicaCount: {{ .Values.cluster.storageReplicas }} # min(3, workers)
  storageMinimalAvailablePercentage: 15
  # The disk holds only Longhorn data, so the 30% default reservation is wasted space.
  storageReservedPercentageForDefaultDisk: 10
  # Volumes rarely fill up; the real safety margin is storageMinimalAvailablePercentage.
  storageOverProvisioningPercentage: 200
  replicaSoftAntiAffinity: false
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  # Lets Kured drain a node once its replicas exist elsewhere.
  nodeDrainPolicy: block-for-eviction-if-contains-last-replica
persistence:
  defaultClass: true
  defaultClassReplicaCount: {{ .Values.cluster.storageReplicas }}
preUpgradeChecker:
  jobEnabled: false # Argo CD sync would hang on the hook
longhornUI:
  replicas: 1
ingress:
  enabled: true
  ingressClassName: cilium
  host: longhorn.{{ .Values.cluster.domain }}
  tls: true
  tlsSecret: "" # served with the wildcard certificate
metrics:
  serviceMonitor:
    enabled: true
