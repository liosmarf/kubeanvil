# Superset of the bootstrap values in ansible/roles/cilium: Argo CD adopts that release.
k8sServiceHost: {{ .Values.cluster.apiVip | quote }}
k8sServicePort: 6443
kubeProxyReplacement: true
k8sClientRateLimit: { qps: 50, burst: 100 }
ipam:
  mode: kubernetes
routingMode: tunnel
tunnelProtocol: vxlan
bpf:
  masquerade: true
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
l2announcements:
  enabled: true
externalIPs:
  enabled: true
ingressController:
  enabled: true
  default: true
  loadbalancerMode: shared
  service:
    annotations:
      lbipam.cilium.io/ips: {{ .Values.cluster.loadBalancerRange.start | quote }}
  # Ingresses without a secretName get the wildcard certificate from cert-manager.
  defaultSecretNamespace: kube-system
  defaultSecretName: wildcard-tls
  enforceHttps: true
gatewayAPI:
  enabled: true
hubble:
  enabled: true
  tls:
    auto:
      method: cronJob # helm-generated certs change on every render and cause endless drift
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled: [dns, drop, tcp, flow, icmp, http]
    serviceMonitor:
      enabled: true
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
# Cilium reads its ConfigMap only at start-up: roll the pods when it changes.
rollOutCiliumPods: true
operator:
  replicas: 2
  rollOutPods: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
envoy:
  prometheus:
    serviceMonitor:
      enabled: true
