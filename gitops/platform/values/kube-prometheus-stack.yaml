{{- $cp := .Values.cluster.controlPlaneIps }}
# K3s runs these components inside the k3s binary; scrape them on the control plane IPs.
kubeControllerManager:
  endpoints: {{ toJson $cp }}
  service: { port: 10257, targetPort: 10257 }
  serviceMonitor: { https: true, insecureSkipVerify: true }
kubeScheduler:
  endpoints: {{ toJson $cp }}
  service: { port: 10259, targetPort: 10259 }
  serviceMonitor: { https: true, insecureSkipVerify: true }
kubeEtcd:
  endpoints: {{ toJson $cp }}
  service: { port: 2381, targetPort: 2381 }
kubeProxy:
  enabled: false # replaced by Cilium
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 18GB
    # Pick up monitors from every namespace, not only this release's.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 3Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 20Gi } }
alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 2Gi } }
grafana:
  admin:
    existingSecret: grafana-admin # created once at bootstrap by ansible/roles/argocd
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: cilium
    hosts: [grafana.{{ .Values.cluster.domain }}]
    tls:
      - hosts: [grafana.{{ .Values.cluster.domain }}]
  persistence:
    enabled: false # dashboards and data sources come from Git
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      access: proxy
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }
prometheus-node-exporter:
  tolerations:
    - operator: Exists
