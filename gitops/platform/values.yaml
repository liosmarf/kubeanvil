# Per-cluster values are rendered by `kubeanvil generate` and passed inline by the root
# Application (ADR 0007); gitops/clusters/example/values.yaml shows a full set. These
# defaults only document the shape.
cluster:
  name: ""
  apiVip: ""
  controlPlaneIps: []
  storageReplicas: 3        # copies of each Longhorn volume: min(3, workers)
  domain: ""                # apps are published as <app>.<domain>
  loadBalancerRange: { start: "", stop: "" }
  timezone: UTC
  dns:
    provider: none          # cloudflare | rfc2136 | none
    zone: ""                # rfc2136 only
    server: ""              # rfc2136 only
  tls:
    issuer: internal-ca     # letsencrypt | internal-ca
    acmeEmail: ""
  backup:
    s3: {}                  # { endpoint, region, bucket } — empty disables Velero

gitops:
  repoUrl: ""
  revision: main

# Category id -> option id from catalog.yaml. Missing categories use the catalog default.
components: {}

argocd:
  namespace: argocd
  project: default
